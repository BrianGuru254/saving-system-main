services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: savora
      POSTGRES_USER: savora
      POSTGRES_PASSWORD: savora
    ports: ["5432:5432"]
    volumes: ["savora-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savora -d savora"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  savora-postgres: